name: Main

on:
  push:
    branches:
      - "**"
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PREMAKE_VERSION: "5.0.0-beta8"

jobs:
  build-windows:
    name: Build Windows
    # windows-2025 image now ships VS 18 only, premake beta8 can't
    # generate anything newer than vs2022 (v143). Move back when it can.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - release
        arch:
          - x86
          - x64
          - arm64
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64
          - arch: arm64
            platform: arm64
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Add premake5 to PATH
        uses: diamante0018/setup-premake@v0.0.4
        with:
          version: ${{ env.PREMAKE_VERSION }}

      - name: Generate project files
        run: premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.arch}} ${{matrix.config}} binaries
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.config}} /p:Platform=${{matrix.platform}} build/gsc-tool.sln

      - name: Run tests
        if: matrix.arch != 'arm64'
        run: build/bin/${{matrix.arch}}/${{matrix.config}}/xsk-tests.exe

      - name: Upload ${{matrix.arch}} ${{matrix.config}} binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{matrix.arch}}-${{matrix.config}}
          path: |
            build/bin/${{matrix.arch}}/${{matrix.config}}/gsc-tool.exe

  build-macos:
    name: Build macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        config:
          - release
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add premake5 to PATH
        uses: diamante0018/setup-premake@v0.0.4
        with:
          version: ${{ env.PREMAKE_VERSION }}

      - name: Generate project files
        run: premake5 gmake

      - name: Set up problem matching
        uses: ammaraskar/gcc-problem-matcher@master

      - name: Build ${{matrix.arch}} ${{matrix.config}} binaries
        run: make -C build config=${{matrix.config}}_${{matrix.arch}} -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        if: matrix.arch == 'arm64'
        run: build/bin/${{matrix.arch}}/${{matrix.config}}/xsk-tests

      - name: Upload ${{matrix.arch}} ${{matrix.config}} binaries
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{matrix.arch}}-${{matrix.config}}
          path: |
            build/bin/${{matrix.arch}}/${{matrix.config}}/gsc-tool

  prebuild-linux:
    name: Prebuild Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add premake5 to PATH
        uses: diamante0018/setup-premake@v0.0.4
        with:
          version: ${{ env.PREMAKE_VERSION }}

      - name: Generate project files
        run: premake5 gmake

      - name: Upload project files
        uses: actions/upload-artifact@v7
        with:
          name: linux-project-files
          path: |
            build/
            include/xsk/version.hpp

  build-linux:
    name: Build Linux
    runs-on: ${{ matrix.os }}
    needs: prebuild-linux
    strategy:
      fail-fast: false
      matrix:
        config:
          - release
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download project files
        uses: actions/download-artifact@v8
        with:
          name: linux-project-files
          path: ./

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18

      - name: Set up problem matching
        uses: ammaraskar/gcc-problem-matcher@master

      - name: Build ${{matrix.arch}} ${{matrix.config}} binaries
        run: make -C build config=${{matrix.config}}_${{matrix.arch}} -j$(nproc)
        env:
         CC: clang-18
         CXX: clang++-18

      - name: Run tests
        run: build/bin/${{matrix.arch}}/${{matrix.config}}/xsk-tests

      - name: Upload ${{matrix.arch}} ${{matrix.config}} binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{matrix.arch}}-${{matrix.config}}
          path: |
            build/bin/${{matrix.arch}}/${{matrix.config}}/gsc-tool

  deploy:
    name: Deploy Release
    runs-on: ubuntu-latest
    needs: [ build-windows, build-macos, build-linux ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            README.md
          sparse-checkout-cone-mode: false

      - name: Download Binaries
        uses: actions/download-artifact@v8

      - name: Compress Binaries
        run: |
          rm -rf linux-project-files/

          for dir in */; do
            if [[ $dir == *"windows"* ]]; then
              cd "$dir" && zip -r "../${dir%/}.zip" . && cd ..
            else
              tar -czvf "${dir%/}.tar.gz" -C "$dir" .
            fi
          done
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          draft: true
          files: |
            *.zip
            *.tar.gz

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            xensik/gsc-tool
            ghcr.io/xensik/gsc-tool
          tags: |
            ${{ github.ref_name }}
            latest

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # no attestation, the cosign signature covers the index
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update DockerHub Information
        uses: peter-evans/dockerhub-description@v5
        with:
          repository: xensik/gsc-tool
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # sign by digest, once per registry (dockerhub + ghcr)
        run: |
          echo "${TAGS}" | cut -d: -f1 | sort -u | xargs -I {} cosign sign --yes {}@${DIGEST}
